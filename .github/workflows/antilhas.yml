name: Radar Antilhas (Météo-France)
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}
concurrency:
  group: antilhas
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -r robo/requirements.txt
      - run: python robo/antilhas.py
        env:
          PYTHONUNBUFFERED: "1"
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
