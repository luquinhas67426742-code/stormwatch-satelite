name: Satélite - prévia antes x depois
on:
  workflow_dispatch: {}
  push:
    paths: ['robo/sat_preview.py', '.github/workflows/sat-preview.yml']
permissions:
  contents: write
jobs:
  previa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -r robo/requirements.txt
      - run: python robo/sat_preview.py
        env:
          PYTHONUNBUFFERED: "1"
      - name: Salva as imagens
        run: |
          git config user.name "stormwatch-robo"; git config user.email "robo@users.noreply.github.com"
          git add testes/sat_*.jpg
          git commit -m "Prévia do satélite (antes x depois)" || exit 0
          git pull --rebase && git push
