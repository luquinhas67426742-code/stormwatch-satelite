name: Teste FUNCEME (radar)
on:
  workflow_dispatch: {}
  push:
    paths: ['robo/funceme_teste.py', '.github/workflows/funceme-teste.yml']
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 robo/funceme_teste.py
      - run: |
          git config user.name "stormwatch-robo"; git config user.email "robo@users.noreply.github.com"
          git add testes/funceme_teste.json; git commit -m "Resultado do teste FUNCEME" || exit 0
          git pull --rebase && git push
