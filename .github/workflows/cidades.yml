name: Cidades das Américas (busca)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python robo/cidades.py
      - run: |
          git config user.name "StormWatch robô"
          git config user.email "robo@users.noreply.github.com"
          git add dados/cidades-americas.json
          git commit -qm "Cidades das Américas (GeoNames)" || echo "sem mudança"
          git pull -q --rebase
          git push
