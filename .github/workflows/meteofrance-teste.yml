name: Teste Météo-France (Antilhas)
on:
  workflow_dispatch: {}
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python robo/meteofrance_teste.py
        env:
          PYTHONUNBUFFERED: "1"
          MF_API_KEY: ${{ secrets.MF_API_KEY }}
