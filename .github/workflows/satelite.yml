name: Satélite HD (GOES-19)
on:
  schedule:
    - cron: "3-53/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: satelite
  cancel-in-progress: false

jobs:
  processar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -r robo/requirements.txt
      - run: python robo/satelite.py
        env:
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '52' || '0' }}
          PYTHONUNBUFFERED: "1"
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
