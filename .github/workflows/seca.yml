name: Seca (dias sem chuva · INPE)
on:
  schedule:
    # o INPE publica lá pelas 07h UTC; tenta 2 vezes por dia
    - cron: "23 9,15 * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Gravar de novo mesmo se o dia já estiver salvo"
        type: boolean
        default: false
      listar:
        description: "Só listar os arquivos do INPE (teste)"
        type: boolean
        default: false
concurrency:
  group: seca
  cancel-in-progress: false
jobs:
  seca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt
      - run: pip install -r robo/requirements.txt
      - run: python robo/seca.py ${{ inputs.forcar && '--forcar' || '' }} ${{ inputs.listar && '--listar' || '' }}
        working-directory: .
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: robo
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE: ${{ secrets.CF_KV_NAMESPACE }}
