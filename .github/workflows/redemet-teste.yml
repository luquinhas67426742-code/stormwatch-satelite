name: Teste REDEMET (produtos de radar)
on:
  workflow_dispatch:
  push:
    paths: ['robo/redemet_teste.py', '.github/workflows/redemet-teste.yml']
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testa os produtos
        env:
          REDEMET_KEY: ${{ secrets.REDEMET_KEY }}
          REDEMET_KEY_2: ${{ secrets.REDEMET_KEY_2 }}
          REDEMET_KEY_3: ${{ secrets.REDEMET_KEY_3 }}
        run: python3 robo/redemet_teste.py
      - name: Salva o resultado (sem a chave)
        run: |
          git config user.name "stormwatch-robo"; git config user.email "robo@users.noreply.github.com"
          git add testes/redemet_teste.json
          git commit -m "Resultado do teste da REDEMET" || exit 0
          git pull --rebase && git push
