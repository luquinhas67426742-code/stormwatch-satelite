name: Contorno das Américas (uma vez)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests shapely
      - run: python robo/geo_americas.py
      - run: |
          git config user.name "StormWatch robô"
          git config user.email "robo@users.noreply.github.com"
          git add dados/geo-americas.json
          git commit -m "Contorno das Américas (Natural Earth)" || echo "sem mudança"
          git push
